services:
  nginx:
    image: nginx:alpine
    container_name: clean-arch-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - client

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: clean-arch-nuxt
    volumes:
      - ./client:/app
      - nuxt_node_modules:/app/node_modules
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - NUXT_PUBLIC_API_BASE=/api
      - NUXT_API_INTERNAL_BASE=http://api:8080/api
    depends_on:
      - api

  api:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: clean-arch-api
    volumes:
      - ./server:/src
      - dotnet_nuget:/root/.nuget/packages
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=cleanarch;Username=postgres;Password=devpassword
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    container_name: clean-arch-postgres
    environment:
      POSTGRES_DB: cleanarch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clean-arch-redis
    volumes:
      - redis_data:/data

volumes:
  nuxt_node_modules:
  dotnet_nuget:
  postgres_data:
  redis_data: